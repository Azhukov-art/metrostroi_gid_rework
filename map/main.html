<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>АС ЕГИД</title>

		<link rel="icon" type="image/x-icon" href="/static/favicon.ico">

		<style>
			* { box-sizing: border-box; margin: 0; padding: 0; }

			html, body { width: 100%; height: 100vh; overflow: hidden; }

			body {
				font-family: Tahoma, "MS Sans Serif", Arial, sans-serif;
				background-color: #e0e1da;
				color: #000;
				font-size: 16px;
				display: flex;
				flex-direction: column;
			}

			header {
				min-height: 40px;
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 6px;
				padding: 4px 8px;
				background: rgb(191,171,133);
				border-top: 2px solid #fff;
				border-left: 2px solid #fff;
				border-bottom: 2px solid #666;
				border-right: 2px solid #666;
			}

			header > .logo { font-weight: bold; padding: 0 12px; font-size: 14px; }
			header > .item { display: flex; align-items: center; margin: 0 6px; font-size: 13px; }

			header select,
			header input[type="date"] {
				font-size: 13px;
				padding: 3px 5px;
				margin-left: 6px;
				border: 2px solid #fff;
				box-shadow: inset -1px -1px 0 0 #aaa;
				background: #ddd;
			}

			a { color: #0000ee; text-decoration: underline; }

			button {
				font-family: inherit;
				font-size: 12px;
				padding: 4px 8px;
				border: 2px solid #fff;
				background: linear-gradient(#eee, #ccc);
				box-shadow: inset -1px -1px 0 0 #aaa;
				cursor: pointer;
			}

			button:active { border: 2px solid #666; box-shadow: inset 1px 1px 0 0 #fff; }

			input[type="text"] {
				font-size: 13px;
				padding: 3px 5px;
				border: 2px solid #fff;
				box-shadow: inset -1px -1px 0 0 #aaa;
				background: #fff;
			}

			.main-viewport {
				flex: 1;
				width: 100%;
				overflow-x: auto;
				overflow-y: hidden;
				display: flex;
				position: relative;
				background-color: #e0e1da;
				border-top: 2px solid #666;
				border-left: 2px solid #666;
				border-bottom: 2px solid #fff;
				border-right: 2px solid #fff;
			}

			/* Список карт за день */
			#dayList {
				flex: 1;
				display: flex;
				flex-wrap: wrap;
				align-content: flex-start;
				gap: 12px;
				padding: 16px;
				overflow-y: auto;
			}

			.hint { font-size: 15px; padding: 12px; color: #333; }

			.card {
				width: 280px;
				padding: 12px 14px;
				background: #fff;
				border: 2px solid #999;
				box-shadow: 3px 3px 0 #666;
				cursor: pointer;
			}

			.card:hover { background: #fffbe6; }

			.card .name { font-weight: bold; font-size: 17px; margin-bottom: 6px; }
			.card .time { font-size: 15px; }

			.card.disabled {
				background: #c8c8c8;
				color: #777;
				border-color: #aaa;
				box-shadow: none;
				cursor: not-allowed;
			}

			.card.disabled:hover { background: #c8c8c8; }

			.card .nocfg { font-size: 12px; color: #555; margin-top: 6px; }

			/* График */
			.canvas-wrapper {
				width: 39000px;
				height: 100%;
				position: relative;
				display: flex;
			}

			#container {
				width: 39000px;
				height: 100%;
				overflow: hidden;
				margin-left: -231px;
			}

			#stations {
				display: flex;
				flex-direction: column;
				background-color: wheat;
				border-right: 2px solid #666;
				z-index: 10;
				height: 100%;
			}

			.StationText {
				flex: 1;
				display: flex;
				align-items: center;
				justify-content: flex-end;
				border-bottom: 2.5px solid black;
				font-size: 23px;
				padding-right: 8px;
				white-space: nowrap;
			}

			#loader {
				position: absolute;
				width: 100vw;
				height: 100%;
				display: flex;
				align-items: center;
				justify-content: center;
				z-index: 5;
			}

			/* Окно настроек серверов */
			.popup {
				position: fixed;
				top: 15%;
				left: 50%;
				width: 560px;
				margin-left: -280px;
				background: #c0c0c0;
				border-top: 2px solid #fff;
				border-left: 2px solid #fff;
				border-bottom: 2px solid #666;
				border-right: 2px solid #666;
				z-index: 99999;
			}

			.popup > header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				background: #000080;
				color: #fff;
				padding: 4px 8px;
				min-height: auto;
			}

			.popup > header h2 { font-size: 15px; }

			.popup > header > a {
				color: #fff;
				cursor: pointer;
				text-decoration: none;
				padding: 0 4px;
				font-size: 18px;
			}

			.popup { max-height: 85vh; overflow-y: auto; }

			#buttonsSettings { padding: 6px; }

			.serverSection {
				margin: 8px 6px 6px;
				padding-top: 6px;
				border-top: 2px solid #666;
			}

			.sectionTitle { font-size: 13px; padding: 4px 6px; }

			#serversBox { padding: 8px; background: #fff; border: 2px solid #aaa; }

			.srvRow {
				display: flex;
				align-items: center;
				gap: 6px;
				padding: 6px 0;
				border-bottom: 1px solid #ddd;
			}

			.srvRow .srvName { font-weight: bold; width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
			.srvRow input.srvKey { flex: 1; font-family: monospace; font-size: 12px; }

			.addRow { display: flex; gap: 6px; padding-top: 10px; }
			.addRow input[type="text"] { flex: 1; }

			.hidden { display: none !important; }

			.ctxMenu {
				position: fixed;
				min-width: 230px;
				padding: 8px 10px;
				background: #fff;
				border: 2px solid #666;
				box-shadow: 3px 3px 0 #333;
				font-size: 13px;
				z-index: 100000;
			}

			.ctxMenu .row { margin: 4px 0; }
			.ctxMenu .title { font-weight: bold; font-size: 14px; margin-bottom: 6px; }
			.ctxMenu button { margin-top: 8px; }
		</style>
	</head>

	<body>
		<header>
			<div class="logo">АС ЕГИД</div>

			<!-- Скрытый элемент: gid.js заполняет его картами, выбор делается по карточкам -->
			<select id="map" class="hidden">
				<option value="">-- Выберите карту --</option>
			</select>

			<div class="item">
				Сервер:
				<select id="server">
					<option value="">-- Выберите сервер --</option>
				</select>
			</div>

			<div class="item">
				День:
				<input id="graphDate" name="graphDate" type="date" />
			</div>

			<div class="item">
				<button id="backToList" class="hidden">← Карты дня</button>
				<button id="refreshGraph" class="hidden">Обновить нитки</button>
				<label class="item hidden" id="showDeletedWrap"><input type="checkbox" id="showDeleted" /> Удалённые</label>
				<label class="item hidden" id="ngdpWrap">НГДП:
					<select id="graph">
						<option value="0">— без НГДП —</option>
					</select>
				</label>
			</div>

			<div class="item">
				<button id="open-settings">Настройки</button>
			</div>

			<div class="item" id="authItem" style="margin-left: auto;">
				Авторизация:
				<span id="authStatus">Загрузка...</span>
			</div>
		</header>

		<div class="main-viewport">
			<div id="dayList">
				<div class="hint">Выберите сервер и день</div>
			</div>

			<div class="canvas-wrapper hidden" id="canvasWrap">
				<div id="loader"></div>
				<div id="stations"></div>
				<div id="container"></div>
			</div>
		</div>

		<div class="ctxMenu hidden" id="threadMenu"></div>

		<div class="popup hidden" id="popup">
			<header>
				<h2>Настройки</h2>
				<a id="popup-close" href="#">×</a>
			</header>

			<div id="buttonsSettings">
				<button type="submit" id="mapSettings" onclick="buttonPressSettings(this)">Настроить карту</button>
			</div>

			<div class="serverSection">
				<h3 class="sectionTitle">НГДП (плановые графики)</h3>
				<div id="ngdpBox" style="padding:8px;background:#fff;border:2px solid #aaa;"></div>
			</div>

			<div class="serverSection">
				<h3 class="sectionTitle">Серверы ГИД (ключ вводится в игре: metrostroi_gid_key КЛЮЧ)</h3>
				<div id="serversBox"></div>
			</div>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/two.js@latest/build/two.min.js"></script>
		<script src="/socket.io/socket.io.js"></script>
		<script src="/static/gid.js"></script>

		<script>
			(function () {
				const dayList = document.getElementById('dayList');
				const canvasWrap = document.getElementById('canvasWrap');
				const backBtn = document.getElementById('backToList');
				const popup = document.getElementById('popup');
				const serversBox = document.getElementById('serversBox');
				let currentServerId = null;

				// Сегодня по МСК (UTC+3)
				const todayStr = () => new Date(Date.now() + 3 * 3600 * 1000).toISOString().slice(0, 10);

				const urlParams = new URLSearchParams(location.search);
				let restoreMap = urlParams.get('map');
				let pendingMap = null;

				function saveState(mapKey) {
					const p = new URLSearchParams();
					if (dataField.value) p.set('date', dataField.value);
					if (currentServerId) p.set('server', String(currentServerId));
					if (mapKey) p.set('map', mapKey);
					history.replaceState(null, '', location.pathname + '?' + p.toString());
				}

				function showDayList() {
					canvasWrap.classList.add('hidden');
					dayList.classList.remove('hidden');
					backBtn.classList.add('hidden');
					document.getElementById('refreshGraph').classList.add('hidden');
					document.getElementById('showDeletedWrap').classList.add('hidden');
					document.getElementById('ngdpWrap').classList.add('hidden');
					threadMenu.classList.add('hidden');
					saveState(null);
				}

				function showGraph() {
					dayList.classList.add('hidden');
					canvasWrap.classList.remove('hidden');
					backBtn.classList.remove('hidden');
					document.getElementById('refreshGraph').classList.remove('hidden');
					document.getElementById('showDeletedWrap').classList.remove('hidden');
					document.getElementById('ngdpWrap').classList.remove('hidden');
				}

				// Перезагружает карту и нитки с сервера (без перезагрузки страницы)
				function reloadGraph(mapKey) {
					renderedNGDP = [];
					hoveredThread = null;
					hoverLines = [];
					document.getElementById('container').innerHTML = '';
					document.getElementById('stations').innerHTML = '';
					mapField.value = mapKey;
					mapField.dispatchEvent(new Event('input'));
					// Страховка: если карта не пришла за 3 секунды, не держим загрузку вечно
					setTimeout(() => {
						if (template) hideLoader();
					}, 3000);
				}

				// ===== НГДП на карте =====
				const ngdpSelect = document.getElementById('graph');

				function requestNGDP() {
					if (!currentServerId) return;
					socket.emit('ChangeNGDP', { ngdpId: Number(ngdpSelect.value) || 0, date: dataField.value || todayStr() });
				}

				ngdpSelect.addEventListener('change', requestNGDP);
				dataField.addEventListener('change', requestNGDP);

				// Список НГДП карты: строим заново, без дублей, сохраняем выбор если он есть
				socket.on('AllowedNGDP', list => {
					const prev = ngdpSelect.value;
					ngdpSelect.innerHTML = '';
					const none = document.createElement('option');
					none.value = '0';
					none.textContent = '— без НГДП —';
					ngdpSelect.append(none);
					list.forEach(n => {
						const o = document.createElement('option');
						o.value = String(n.ID);
						o.textContent = n.Name;
						ngdpSelect.append(o);
					});
					ngdpSelect.value = list.some(n => String(n.ID) === prev) ? prev : '0';
					requestNGDP();
				});

				// Карта построена — снова просим НГДП, иначе линии пропадут после перезагрузки сетки
				socket.on('MapTableSend', () => requestNGDP());

				// Убираем «ЗАГРУЗКА» сразу, как только карта построена (не ждём первой таблицы поездов)
				function hideLoader() {
					const l = document.getElementById('loader');
					l.innerHTML = '';
					l.style.display = 'none';
				}

				// Список карт пришёл — теперь можно открыть карту из адреса
				socket.on('AllowedMaps', () => {
					if (!pendingMap) return;
					const exists = mapField.querySelector('option[value="' + pendingMap + '"]');
					if (!exists) { pendingMap = null; return; }
					const m = pendingMap;
					pendingMap = null;
					openMap(m);
				});

				socket.on('MapTableSend', () => {
					// gid.js уже построил сетку, поэтому можно скрыть загрузку
					hideLoader();
				});

				// ===== Нитки: правая кнопка, информация, удаление =====
				const threadMenu = document.getElementById('threadMenu');
				const showDeletedBox = document.getElementById('showDeleted');
				let currentThreadId = null;

				showDeletedBox.addEventListener('change', () => {
					socket.emit('SetShowDeleted', showDeletedBox.checked);
				});

				function distToSegment(px, py, x1, y1, x2, y2) {
					const dx = x2 - x1, dy = y2 - y1;
					const len2 = dx * dx + dy * dy;
					let t = len2 === 0 ? 0 : ((px - x1) * dx + (py - y1) * dy) / len2;
					t = Math.max(0, Math.min(1, t));
					const cx = x1 + t * dx, cy = y1 + t * dy;
					return Math.hypot(px - cx, py - cy);
				}

				function findThreadAt(clientX, clientY) {
					const canvas = twolink && twolink.renderer && twolink.renderer.domElement;
					if (!canvas) return null;
					const rect = canvas.getBoundingClientRect();
					const x = clientX - rect.left;
					const y = clientY - rect.top;
					let best = null;
					let bestDist = 8; // радиус захвата в пикселях
					gidSegments.forEach(seg => {
						const d = distToSegment(x, y, seg.x1, seg.y1, seg.x2, seg.y2);
						if (d < bestDist) {
							bestDist = d;
							best = seg.threadId;
						}
					});
					return best;
				}

				function openThreadMenu(threadId, clientX, clientY) {
					currentThreadId = threadId;
					threadMenu.innerHTML = '';
					const loading = document.createElement('div');
					loading.className = 'row';
					loading.textContent = 'Загрузка...';
					threadMenu.append(loading);
					threadMenu.style.left = clientX + 'px';
					threadMenu.style.top = clientY + 'px';
					threadMenu.classList.remove('hidden');
					socket.emit('GetThreadInfo', threadId);

					setTimeout(() => {
						if (currentThreadId === threadId && threadMenu.textContent.includes('Загрузка')) {
							threadMenu.innerHTML = '';
							const err = document.createElement('div');
							err.className = 'row';
							err.textContent = 'Нет ответа от сервера. Перезапустите node server.js и обновите страницу (Ctrl+F5).';
							threadMenu.append(err);
						}
					}, 3000);
				}

				socket.on('ThreadInfo', info => {
					if (info.ThreadID !== currentThreadId) return;
					threadMenu.innerHTML = '';

					const title = document.createElement('div');
					title.className = 'title';
					title.textContent = 'Нитка №' + info.ThreadID + (info.Deleted ? ' (удалена)' : '');
					threadMenu.append(title);

					const rows = [
						'Номер маршрута: ' + (info.Route || '—'),
						'Ник: ' + (info.Nick || 'нет данных'),
						'Поезд: ' + (info.TrainType || '—')
					];
					rows.forEach(text => {
						const r = document.createElement('div');
						r.className = 'row';
						r.textContent = text;
						threadMenu.append(r);
					});

					if (info.CanEdit) {
						const btn = document.createElement('button');
						btn.textContent = info.Deleted ? 'Восстановить нитку' : 'Удалить нитку';
						btn.addEventListener('click', () => {
							socket.emit('SetThreadDeleted', { threadId: info.ThreadID, deleted: !info.Deleted });
							threadMenu.classList.add('hidden');
							reloadGraph(mapField.value);
						});
						threadMenu.append(btn);
					}
				});

				function findNGDPRouteAt(clientX, clientY) {
					const canvas = twolink && twolink.renderer && twolink.renderer.domElement;
					if (!canvas) return null;
					const rect = canvas.getBoundingClientRect();
					const x = clientX - rect.left;
					const y = clientY - rect.top;
					let best = null;
					let bestDist = 8;
					ngdpSegments.forEach(seg => {
						const d = distToSegment(x, y, seg.x1, seg.y1, seg.x2, seg.y2);
						if (d < bestDist) { bestDist = d; best = seg.route; }
					});
					return best;
				}

				document.addEventListener('contextmenu', e => {
					if (canvasWrap.classList.contains('hidden')) return;
					const threadId = findThreadAt(e.clientX, e.clientY);
					if (threadId !== null && threadId !== undefined) {
						e.preventDefault();
						openThreadMenu(threadId, e.clientX, e.clientY);
						return;
					}
					const route = findNGDPRouteAt(e.clientX, e.clientY);
					if (route !== null && route !== undefined) {
						e.preventDefault();
						currentThreadId = null;
						threadMenu.innerHTML = '';
						const title = document.createElement('div');
						title.className = 'title';
						title.textContent = 'НГДП, маршрут ' + route;
						threadMenu.append(title);
						threadMenu.style.left = e.clientX + 'px';
						threadMenu.style.top = e.clientY + 'px';
						threadMenu.classList.remove('hidden');
					}
				});

				document.addEventListener('click', e => {
					if (!threadMenu.contains(e.target)) threadMenu.classList.add('hidden');
				});

				// Подсветка нитки под курсором: поверх неё рисуем толстую линию с круглыми концами
				let hoveredThread = null;
				let hoverLines = [];

				function clearHover() {
					if (!twolink) return;
					hoverLines.forEach(l => twolink.remove(l));
					hoverLines = [];
				}

				function showHover(threadId) {
					clearHover();
					gidSegments.forEach(seg => {
						if (seg.threadId !== threadId) return;
						const l = twolink.makeLine(seg.x1, seg.y1, seg.x2, seg.y2);
						l.linewidth = 6;
						l.cap = 'round';
						l.stroke = seg.line && seg.line.stroke ? seg.line.stroke : '#000';
						hoverLines.push(l);
					});
					twolink.update();
				}

				document.addEventListener('mousemove', e => {
					if (canvasWrap.classList.contains('hidden')) return;
					const threadId = findThreadAt(e.clientX, e.clientY);
					if (threadId === hoveredThread) return;

					hoveredThread = threadId;
					if (hoveredThread === null) {
						clearHover();
						twolink.update();
					} else {
						showHover(hoveredThread);
					}
				});

				// F5 и Ctrl+R не перезагружают страницу, а обновляют нитки и карту
				document.addEventListener('keydown', e => {
					const isRefresh = e.key === 'F5' || ((e.ctrlKey || e.metaKey) && (e.key === 'r' || e.key === 'R'));
					if (!isRefresh) return;
					e.preventDefault();

					if (!canvasWrap.classList.contains('hidden') && mapField.value) {
						reloadGraph(mapField.value);
					} else {
						loadDay();
					}
				});

				document.getElementById('refreshGraph').addEventListener('click', () => {
					const mapKey = mapField.value;
					if (mapKey) reloadGraph(mapKey);
				});

				function loadDay() {
					if (!currentServerId) {
						dayList.innerHTML = '<div class="hint">Выберите сервер</div>';
						return;
					}
					dayList.innerHTML = '<div class="hint">Загрузка...</div>';
					socket.emit('GetDaySegments', { serverId: currentServerId, date: dataField.value || todayStr() });
				}

				function openMap(mapKey) {
					showGraph();
					saveState(mapKey);
					reloadGraph(mapKey);
				}

				// Карточки: одна на карту, внутри — все её промежутки времени
				socket.on('DaySegments', groups => {
					dayList.innerHTML = '';
					if (!groups.length) {
						dayList.innerHTML = '<div class="hint">За этот день на сервере нет поездов</div>';
						return;
					}
					groups.forEach(g => {
						const card = document.createElement('div');
						card.className = 'card' + ((g.HasConfig || g.Unknown) ? '' : ' disabled') + (g.Unknown ? ' disabled' : '');

						const name = document.createElement('div');
						name.className = 'name';
						name.textContent = g.Name;
						card.append(name);

						g.Times.forEach(t => {
							const line = document.createElement('div');
							line.className = 'time';
							line.textContent = t.StartText + ' - ' + t.EndText;
							card.append(line);
						});

						if (!g.Unknown && !g.HasConfig) {
							const note = document.createElement('div');
							note.className = 'nocfg';
							note.textContent = 'Нет конфига карты';
							card.append(note);
						}

						if (g.HasConfig && !g.Unknown) {
							card.addEventListener('click', () => openMap(g.Map));
						}

						dayList.append(card);
					});
				});

				// Список серверов (после gid.js, поэтому перестраивает select без дублей)
				socket.on('AllowedServers', list => {
					const prev = currentServerId;
					serverField.innerHTML = '<option value="">-- Выберите сервер --</option>';
					list.forEach(s => {
						const o = document.createElement('option');
						o.value = String(s.ID);
						o.textContent = s.Name;
						serverField.append(o);
					});

					const wantServer = urlParams.get('server');
					if (!prev && wantServer && list.some(s => String(s.ID) === wantServer)) {
						serverField.value = wantServer;
						serverField.dispatchEvent(new Event('change'));
					} else if (prev && list.some(s => s.ID === prev)) {
						serverField.value = String(prev);
					} else if (list.length) {
						serverField.value = String(list[0].ID);
						serverField.dispatchEvent(new Event('change'));
					} else {
						currentServerId = null;
						dayList.innerHTML = '<div class="hint">Серверов нет. Добавьте сервер в настройках «Серверы»</div>';
					}
				});

				serverField.addEventListener('change', () => {
					if (!serverField.value) return;
					currentServerId = Number(serverField.value);
					socket.emit('ChangeServer', serverField.value);
					showDayList();
					loadDay();
					if (restoreMap) {
						// Карту откроем, когда придёт список карт (иначе в select ещё пусто)
						pendingMap = restoreMap;
						restoreMap = null;
					}
				});

				dataField.addEventListener('change', () => {
					showDayList();
					loadDay();
				});

				backBtn.addEventListener('click', () => {
					showDayList();
					loadDay();
				});

				// Настройки серверов
				function renderServers(list) {
					serversBox.innerHTML = '';

					list.forEach(s => {
						const row = document.createElement('div');
						row.className = 'srvRow';

						const name = document.createElement('div');
						name.className = 'srvName';
						name.textContent = s.Name;

						const key = document.createElement('input');
						key.type = 'text';
						key.readOnly = true;
						key.className = 'srvKey';
						key.value = s.Key;

						const copy = document.createElement('button');
						copy.textContent = 'Копировать';
						copy.addEventListener('click', () => {
							key.select();
							document.execCommand('copy');
							copy.textContent = 'Скопировано';
						});

						const ren = document.createElement('button');
						ren.textContent = 'Переименовать';
						ren.addEventListener('click', () => {
							const newName = prompt('Новое название сервера:', s.Name);
							if (newName && newName.trim()) {
								socket.emit('RenameServer', { id: s.ID, name: newName.trim() });
							}
						});

						const del = document.createElement('button');
						del.textContent = 'Удалить';
						del.addEventListener('click', () => {
							if (confirm('Удалить сервер «' + s.Name + '»? Записи поездов останутся в базе.')) {
								socket.emit('DeleteServer', s.ID);
							}
						});

						row.append(name, key, copy, ren, del);
						serversBox.append(row);
					});

					const addRow = document.createElement('div');
					addRow.className = 'addRow';

					const nameInput = document.createElement('input');
					nameInput.type = 'text';
					nameInput.placeholder = 'Название сервера';

					const addBtn = document.createElement('button');
					addBtn.textContent = 'Добавить сервер';
					addBtn.addEventListener('click', () => {
						if (!nameInput.value.trim()) return;
						socket.emit('AddServer', nameInput.value);
						nameInput.value = '';
					});

					addRow.append(nameInput, addBtn);
					serversBox.append(addRow);

					const hint = document.createElement('div');
					hint.className = 'hint';
					hint.textContent = 'Скопируйте ключ и в игре в консоли сервера введите: metrostroi_gid_key КЛЮЧ';
					serversBox.append(hint);
				}

				socket.on('ServersFull', renderServers);

				socket.on('Error', msg => alert(msg));

				document.getElementById('open-settings').addEventListener('click', () => {
					popup.classList.remove('hidden');
					socket.emit('GetServers');
					openNGDPBox();
				});

				document.getElementById('popup-close').addEventListener('click', e => {
					e.preventDefault();
					popup.classList.add('hidden');
				});

				// Статус авторизации
				async function fetchAuthStatus() {
					try {
						const r = await fetch('/auth/status', { credentials: 'same-origin' });
						const j = await r.json();
						const el = document.getElementById('authStatus');
						const openBtn = document.getElementById('open-settings');
						if (!j.authenticated) {
							openBtn.style.display = 'none';
							el.innerHTML = '<a href="/auth">Вход</a>';
							return;
						}
						let text = ' <a href="/auth/logout">Выход</a>';
						if (j.trusted) text += ' (доверенный)';
						el.innerHTML = text;
					} catch (e) {
						console.error('auth status error', e);
						document.getElementById('open-settings').style.display = 'none';
						document.getElementById('authStatus').innerHTML = '<a href="/auth">Вход</a>';
					}
				}

				fetchAuthStatus();
			})();
		</script>
	</body>
</html>
